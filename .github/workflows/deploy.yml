name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Cache dependencies
        # Keyed on package.json, not package-lock.json: no lockfile is committed
        # (see the Install Dependencies step below).
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install Dependencies
        # `npm install` rather than `npm ci`: this user's global .gitignore excludes
        # package-lock.json across all projects, so there's no lockfile to `ci` from.
        # --legacy-peer-deps works around a known peer-dep conflict between
        # @quartz-community/latex and @myriaddreamin/rehype-typst in Quartz's
        # own dependency tree (unrelated to this repo's content).
        run: npm install --legacy-peer-deps
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Build Quartz
        run: npx quartz build
      - name: Remove incorrect CNAME
        # Quartz auto-generates public/CNAME from configuration.baseUrl. Since our
        # baseUrl is a project-page path (kid1995.github.io/coding-interview-mastery),
        # not a custom domain, that CNAME would incorrectly claim the bare
        # kid1995.github.io apex domain and could collide with a real user GitHub
        # Pages site. Project pages don't need a CNAME file at all.
        run: rm -f public/CNAME
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
